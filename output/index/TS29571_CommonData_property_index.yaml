    \ string representing an integer\nin the following ranges:\n- 0 to 8 388 607 for\
    \ UE-dedicated PRA\n- 8 388 608 to 16 777 215 for Core Network predefined PRA\n\
    Examples:\nPRA ID 123 is encoded as \"123\"\nPRA ID 11 238 660 is encoded as \"\
    11238660\"\n"
