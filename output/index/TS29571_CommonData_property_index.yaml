    of MCC, MNC and Trace ID as follows: <MCC><MNC>-<Trace ID> The Trace ID shall
    be encoded as a 3 octet string in hexadecimal representation. Each character in
    the Trace ID string shall take a value of "0" to "9", "a" to "f" or "A" to "F"
