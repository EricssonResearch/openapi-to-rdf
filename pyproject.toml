[project]
name = "openapi-to-rdf"
version = "0.2.0"
description = "Convert OpenAPI YAML specifications to RDF vocabularies and SHACL validation shapes for telecom intent-based automation and TMForum standards"
authors = [
    {name = "Jean Martins", email = "jean.martins@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["openapi", "rdf", "shacl", "TMF", "TMForum", "3gpp", "intents", "intent-based", "telecom", "telecommunications", "automation", "semantic-web", "network-management", "5g", "etsi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking",
    "Topic :: Communications"
]
dependencies = [
    "pyyaml>=6.0.2",
    "rdflib>=7.1.3",
]

[project.scripts]
openapi-to-rdf = "openapi_to_rdf.main:main"

[project.urls]
Homepage = "https://github.com/EricssonResearch/openapi-to-rdf"
Repository = "https://github.com/EricssonResearch/openapi-to-rdf"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pyshacl>=0.25.0",
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openapi_to_rdf"]

[tool.pytest.ini_options]
# `--strict-markers` so a typo'd mark fails instead of silently selecting nothing: a
# `-m "not slwo"` that matches everything would quietly run the slow tests it meant to skip.
addopts = "--strict-markers"
markers = [
    "slow: regenerates the whole output/ tree or converts the full corpus (minutes, not seconds). Skip with -m 'not slow' during development; CI runs everything.",
    "writes_output: escape hatch from the tests/conftest.py guard that forbids writing into output/. Nothing uses it; if something needs it, say why in a comment at the mark.",
    "network: reaches 3GPP Forge. Only the corpus-pin verification needs it, and that check cannot be done offline -- it is what would catch a moved tag. Skips with a stated reason rather than passing when the forge is unreachable, because a network test that silently succeeds without a network is worse than no test.",
]

[tool.ruff]
# Minimal ruff configuration - errors only, no style
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# F: pyflakes errors (undefined names, unused imports/variables)
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# OpenAPIToRDFConverter imported for legacy CLI compatibility but not in __all__
"openapi_to_rdf/__init__.py" = ["F401"]
