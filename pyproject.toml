[project]
name = "openapi-to-rdf"
version = "0.2.0"
description = "Convert OpenAPI YAML specifications to RDF vocabularies and SHACL validation shapes for telecom intent-based automation and TMForum standards"
authors = [
    {name = "Jean Martins", email = "jean.martins@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["openapi", "rdf", "shacl", "TMF", "TMForum", "3gpp", "intents", "intent-based", "telecom", "telecommunications", "automation", "semantic-web", "network-management", "5g", "etsi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking",
    "Topic :: Communications"
]
dependencies = [
    "pyyaml>=6.0.2",
    "rdflib>=7.1.3",
    "requests>=2.32.5",
]

[project.scripts]
openapi-to-rdf = "openapi_to_rdf.main:main"

[project.urls]
Homepage = "https://github.com/EricssonResearch/openapi-to-rdf"
Repository = "https://github.com/EricssonResearch/openapi-to-rdf"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pyshacl>=0.25.0",
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openapi_to_rdf"]
